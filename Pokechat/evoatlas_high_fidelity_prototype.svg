  <rect x="650" y="562" width="156" height="64" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="728" y="587" text-anchor="middle" class="font nodeText" fill="#1d4ed8">Espeon</text>
  <rect x="674" y="598" width="108" height="18" rx="9" fill="#dbeafe"/>
