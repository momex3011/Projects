  <rect x="650" y="644" width="156" height="64" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="728" y="669" text-anchor="middle" class="font nodeText" fill="#1d4ed8">Umbreon</text>
