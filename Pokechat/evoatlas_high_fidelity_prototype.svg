  <text x="910" y="572" text-anchor="middle" class="font" font-size="12.5" font-weight="800" fill="#64748b">Flareon</text>
  <text x="910" y="590" text-anchor="middle" class="font tiny">Fire Stone</text>
  <rect x="842" y="620" width="136" height="54" rx="13" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="910" y="642" text-anchor="middle" class="font" font-size="12.5" font-weight="800" fill="#64748b">Leafeon</text>
  <text x="910" y="660" text-anchor="middle" class="font tiny">Leaf Stone</text>
  <rect x="842" y="690" width="136" height="54" rx="13" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="910" y="712" text-anchor="middle" class="font" font-size="12.5" font-weight="800" fill="#64748b">Glaceon</text>
  <text x="910" y="730" text-anchor="middle" class="font tiny">Ice Stone</text>

  <rect x="176" y="846" width="260" height="24" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
  <circle cx="202" cy="858" r="6" fill="#94a3b8"/>
  <text x="220" y="862" class="font tiny">Blocked by item requirement</text>
  <rect x="462" y="846" width="238" height="24" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <circle cx="488" cy="858" r="6" fill="#2563eb"/>
  <text x="506" y="862" class="font tiny">Valid bond-based route</text>
  <rect x="724" y="816" width="254" height="0" fill="none"/>

  <rect x="1062" y="398" width="422" height="474" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="1062" y="398" width="422" height="58" rx="20" fill="#0f172a"/>
  <rect x="1062" y="430" width="422" height="26" fill="#0f172a"/>
  <text x="1092" y="433" class="font" font-size="18" font-weight="800" fill="#ffffff">AI Analysis</text>
  <text x="1092" y="474" class="font label">Parsed constraints</text>
  <rect x="1092" y="488" width="74" height="26" rx="13" fill="#eef2ff"/>
  <text x="1129" y="505" text-anchor="middle" class="font chipText" fill="#3730a3">Eevee</text>
  <rect x="1176" y="488" width="82" height="26" rx="13" fill="#ecfdf5"/>
  <text x="1217" y="505" text-anchor="middle" class="font chipText" fill="#047857">No trade</text>
  <rect x="1268" y="488" width="76" height="26" rx="13" fill="#fff7ed"/>
  <text x="1306" y="505" text-anchor="middle" class="font chipText" fill="#c2410c">No item</text>

  <line x1="1092" y1="532" x2="1454" y2="532" stroke="#e2e8f0"/>
  <text x="1092" y="562" class="font label" fill="#047857">Valid paths</text>
  <rect x="1094" y="580" width="14" height="14" rx="3" fill="#2563eb"/>
  <text x="1118" y="592" class="font small">Espeon: friendship route with daytime condition</text>
  <rect x="1094" y="606" width="14" height="14" rx="3" fill="#2563eb"/>
  <text x="1118" y="618" class="font small">Umbreon: friendship route with nighttime condition</text>
  <rect x="1094" y="632" width="14" height="14" rx="3" fill="#7c3aed"/>
  <text x="1118" y="644" class="font small">Sylveon: friendship plus Fairy move</text>

  <line x1="1092" y1="664" x2="1454" y2="664" stroke="#e2e8f0"/>
  <text x="1092" y="694" class="font label" fill="#b91c1c">Blocked paths</text>
  <text x="1092" y="718" class="font small">Vaporeon, Jolteon, Flareon, Leafeon, and Glaceon</text>
  <text x="1092" y="738" class="font small">are blocked because the query excludes item-based paths.</text>

  <rect x="1092" y="760" width="362" height="90" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1120" y="784" class="font label" fill="#5b21b6">Plan checklist: Eevee -> Sylveon</text>
  <rect x="1120" y="798" width="12" height="12" rx="3" fill="#7c3aed"/>
  <path d="M1123 804L1127 808L1134 800" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1142" y="809" class="font tiny" fill="#334155">Avoid trade and item routes</text>
  <rect x="1120" y="818" width="12" height="12" rx="3" fill="#ffffff" stroke="#a78bfa"/>
  <text x="1142" y="829" class="font tiny" fill="#334155">Raise friendship to 160+</text>
  <rect x="1300" y="818" width="12" height="12" rx="3" fill="#ffffff" stroke="#a78bfa"/>
  <text x="1322" y="829" class="font tiny" fill="#334155">Learn Fairy move</text>
  <rect x="1120" y="836" width="12" height="12" rx="3" fill="#ffffff" stroke="#a78bfa"/>
  <text x="1142" y="847" class="font tiny" fill="#334155">Level up to evolve into Sylveon</text>

  <rect x="146" y="886" width="1338" height="0" fill="none"/>

  <rect x="116" y="884" width="1368" height="2" rx="1" fill="#e2e8f0"/>
  <rect x="116" y="894" width="1368" height="0" fill="none"/>

  <g transform="translate(104 902)">
    <rect x="0" y="-10" width="320" height="62" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="28" cy="20" r="15" fill="#2563eb"/>
    <text x="28" y="25" text-anchor="middle" class="font" font-size="15" font-weight="900" fill="#ffffff">1</text>
    <text x="58" y="14" class="font calloutTitle">Search bar</text>
    <text x="58" y="34" class="font calloutText">Users ask goal-based evolution questions.</text>
  </g>
  <g transform="translate(446 902)">
    <rect x="0" y="-10" width="320" height="62" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="28" cy="20" r="15" fill="#0f766e"/>
    <text x="28" y="25" text-anchor="middle" class="font" font-size="15" font-weight="900" fill="#ffffff">2</text>
    <text x="58" y="14" class="font calloutTitle">Constraint chips</text>
    <text x="58" y="34" class="font calloutText">Shows exactly what the AI understood.</text>
  </g>
  <g transform="translate(788 902)">
    <rect x="0" y="-10" width="320" height="62" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="28" cy="20" r="15" fill="#7c3aed"/>
    <text x="28" y="25" text-anchor="middle" class="font" font-size="15" font-weight="900" fill="#ffffff">3</text>
    <text x="58" y="14" class="font calloutTitle">Evolution map</text>
    <text x="58" y="34" class="font calloutText">Makes branches, matches, and blocks visible.</text>
  </g>
  <g transform="translate(1130 902)">
    <rect x="0" y="-10" width="354" height="62" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="28" cy="20" r="15" fill="#dc2626"/>
    <text x="28" y="25" text-anchor="middle" class="font" font-size="15" font-weight="900" fill="#ffffff">4</text>
    <text x="58" y="14" class="font calloutTitle">AI reasoning and plan</text>
    <text x="58" y="34" class="font calloutText">Explains why and turns a result into steps.</text>
  </g>
</svg>
