<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="0.52" stop-color="#eef5ff"/>
      <stop offset="1" stop-color="#f7f3ff"/>
    </linearGradient>
    <linearGradient id="screenBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f9fbff"/>
      <stop offset="1" stop-color="#f4f8ff"/>
    </linearGradient>
    <linearGradient id="mapBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef6ff"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.6" stop-color="#17315f"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe9ff"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#d8e3f0" stroke-width="1" opacity="0.45"/>
    </pattern>
    <marker id="arrowBlueHiFi" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L9 5L1 9Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGrayHiFi" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L9 5L1 9Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowPurpleHiFi" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L9 5L1 9Z" fill="#7c3aed"/>
    </marker>
    <style>
      .font { font-family: Inter, Segoe UI, Arial, sans-serif; }
      .title { font-size: 34px; font-weight: 800; fill: #0f172a; }
      .subtle { fill: #64748b; }
      .label { font-size: 14px; font-weight: 700; fill: #334155; }
      .small { font-size: 12px; fill: #64748b; }
      .tiny { font-size: 10.5px; fill: #64748b; }
      .panelTitle { font-size: 17px; font-weight: 800; fill: #0f172a; }
      .chipText { font-size: 12px; font-weight: 700; }
      .nodeText { font-size: 14px; font-weight: 800; }
      .triggerText { font-size: 10.5px; font-weight: 700; }
      .calloutText { font-size: 12.5px; fill: #334155; }
      .calloutTitle { font-size: 12.5px; font-weight: 800; fill: #0f172a; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#pageBg)"/>
  <rect width="1600" height="1000" fill="url(#grid)" opacity="0.55"/>

  <text x="80" y="78" class="font title">EvoAtlas High-Fidelity Prototype</text>
  <text x="80" y="108" class="font subtle" font-size="17">Final concept screen for an AI-assisted Pokemon evolution explorer</text>
  <rect x="1234" y="56" width="286" height="42" rx="21" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="1377" y="82" text-anchor="middle" class="font label">Model: Tool | Space: Evolution</text>

  <rect x="64" y="136" width="1472" height="790" rx="30" fill="#ffffff" filter="url(#softShadow)"/>
  <rect x="84" y="156" width="1432" height="750" rx="22" fill="url(#screenBg)" stroke="#dbeafe"/>

  <rect x="84" y="156" width="1432" height="70" rx="22" fill="url(#brandGrad)"/>
  <rect x="84" y="196" width="1432" height="30" fill="url(#brandGrad)"/>
  <circle cx="128" cy="191" r="19" fill="#ffffff" opacity="0.14"/>
  <circle cx="128" cy="191" r="11" fill="#ef4444"/>
  <path d="M118 191H138M128 181V201" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <text x="158" y="187" class="font" font-size="22" font-weight="800" fill="#ffffff">EvoAtlas</text>
  <text x="158" y="208" class="font" font-size="12" fill="#b9d7ff">AI evolution constraint explorer</text>
  <text x="1310" y="196" text-anchor="middle" class="font" font-size="13" font-weight="700" fill="#dff6ff">Explore</text>
  <rect x="1356" y="174" width="94" height="34" rx="17" fill="#ffffff" opacity="0.16"/>
  <text x="1403" y="196" text-anchor="middle" class="font" font-size="13" font-weight="800" fill="#ffffff">Plan</text>

  <rect x="116" y="254" width="1368" height="118" rx="18" fill="#ffffff" stroke="#dbeafe" filter="url(#smallShadow)"/>
  <text x="146" y="288" class="font panelTitle">Ask an evolution question</text>
  <text x="146" y="311" class="font small">The AI turns a natural-language goal into visible evolution constraints.</text>
  <rect x="146" y="326" width="856" height="34" rx="17" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="170" y="348" class="font" font-size="13.5" fill="#0f172a">Which Eevee evolution needs no trade and no item?</text>
  <rect x="1016" y="326" width="108" height="34" rx="17" fill="#2563eb"/>
  <text x="1070" y="348" text-anchor="middle" class="font" font-size="13" font-weight="800" fill="#ffffff">Analyze</text>

  <g transform="translate(1098 272)">
    <rect x="0" y="0" width="64" height="28" rx="14" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="32" y="18" text-anchor="middle" class="font chipText" fill="#3730a3">Eevee</text>
    <rect x="76" y="0" width="82" height="28" rx="14" fill="#ecfdf5" stroke="#bbf7d0"/>
    <text x="117" y="18" text-anchor="middle" class="font chipText" fill="#047857">No trade</text>
    <rect x="170" y="0" width="80" height="28" rx="14" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="210" y="18" text-anchor="middle" class="font chipText" fill="#c2410c">No item</text>
    <rect x="262" y="0" width="104" height="28" rx="14" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="314" y="18" text-anchor="middle" class="font chipText" fill="#6d28d9">Bond routes</text>
  </g>

  <rect x="116" y="398" width="920" height="474" rx="20" fill="url(#mapBg)" stroke="#cbd5e1"/>
  <text x="146" y="434" class="font panelTitle">Evolution Branch Map</text>
  <text x="146" y="456" class="font small">Blue and purple branches match the parsed constraints. Gray branches are blocked.</text>

  <rect x="144" y="486" width="864" height="350" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="338" cy="654" r="54" fill="url(#nodeGlow)" stroke="#334155" stroke-width="3"/>
  <text x="338" y="660" text-anchor="middle" class="font nodeText" fill="#111827">Eevee</text>

  <path d="M390 632C476 558 544 536 630 512" stroke="#94a3b8" stroke-width="3" stroke-dasharray="7 6" fill="none" marker-end="url(#arrowGrayHiFi)"/>
  <path d="M393 642C486 600 550 594 630 594" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#arrowBlueHiFi)"/>
  <path d="M394 664C486 684 550 706 630 736" stroke="#7c3aed" stroke-width="5" fill="none" marker-end="url(#arrowPurpleHiFi)"/>
  <path d="M388 677C474 724 540 772 630 798" stroke="#94a3b8" stroke-width="3" stroke-dasharray="7 6" fill="none" marker-end="url(#arrowGrayHiFi)"/>

