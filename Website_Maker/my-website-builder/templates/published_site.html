<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ current_page.name }} | {{ project_name }}</title>
    <meta
      name="description"
      content="{{ current_page.description or ('Temporary deployed preview for ' ~ project_name) }}"
    />
    <style>
      :root {
        --site-bg: {{ theme.background }};
        --site-surface: {{ theme.surface }};
        --site-surface-alt: {{ theme.surface_alt }};
        --site-text: {{ theme.text }};
        --site-muted: {{ theme.muted }};
        --site-accent: {{ theme.accent }};
        --site-border: {{ theme.border }};
        --site-shadow: {{ theme.shadow }};
        --site-radius: {{ theme.radius }};
        --site-border-width: {{ theme.border_width }};
        --site-border-style: {{ theme.border_style }};
        --site-font-heading: {{ theme.heading_font }};
        --site-font-body: {{ theme.body_font }};
        --site-ambient: {{ theme.ambient }};
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
        padding: 0;
        scroll-behavior: smooth;
      }

      body {
        overflow-x: hidden;
        background:
          radial-gradient(circle at 12% 18%, rgba(255, 184, 209, 0.08), transparent 34%),
          radial-gradient(circle at 88% 12%, rgba(123, 223, 242, 0.08), transparent 28%),
          linear-gradient(180deg, rgba(15, 23, 42, 0.04), rgba(15, 23, 42, 0.02));
        color: #1e293b;
        font-family: "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      .published-shell {
        min-height: 100vh;
        padding: 18px 18px 32px;
      }

      .published-topbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        width: min(calc(100vw - 36px), calc({{ preview_width }}px + 10px));
        margin: 0 auto 14px;
        padding: 14px 16px;
        border: 1px solid #e2e8f0;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 18px 32px rgba(15, 23, 42, 0.08);
        backdrop-filter: blur(14px);
      }

      .published-topbar-copy {
        display: grid;
        gap: 6px;
      }

      .published-kicker {
        margin: 0;
        color: #64748b;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.28em;
        text-transform: uppercase;
      }

      .published-topbar-title {
        margin: 0;
        color: #0f172a;
        font-size: 1.2rem;
        font-weight: 800;
      }

      .published-topbar-subtitle {
        margin: 0;
        color: #475569;
        font-size: 0.94rem;
      }

      .published-topbar-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: flex-end;
        gap: 10px;
      }

      .published-link-pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        padding: 0 16px;
        border: 1px solid #cbd5e1;
        border-radius: 999px;
        background: #ffffff;
        color: #0f172a;
        font-size: 0.94rem;
        font-weight: 700;
        box-shadow: 0 8px 18px rgba(15, 23, 42, 0.06);
        transition: transform 160ms ease, box-shadow 160ms ease;
      }

      .published-link-pill:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 22px rgba(15, 23, 42, 0.1);
      }

      .published-link-pill--accent {
        border-color: #93c5fd;
        background: #eff6ff;
        color: #1d4ed8;
      }

      .published-link-pill--dark {
        border-color: transparent;
        background: #0f172a;
        color: #ffffff;
      }

      .published-page-strip {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .published-page-chip {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 38px;
        padding: 0 14px;
        border: 1px solid #cbd5e1;
        border-radius: 999px;
        background: #ffffff;
        color: #334155;
        font-size: 0.88rem;
        font-weight: 700;
      }

      .published-page-chip.is-current {
        border-color: #93c5fd;
        background: #eff6ff;
        color: #1d4ed8;
      }

      .published-stage-scroll {
        overflow-x: auto;
        padding-bottom: 10px;
      }

      .canvas-grid {
        width: min(calc(100vw - 36px), calc({{ preview_width }}px + 10px));
        margin: 0 auto;
        background-color: #f8fafc;
        background-image:
          linear-gradient(rgba(104, 112, 157, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(104, 112, 157, 0.08) 1px, transparent 1px);
        background-size: 36px 36px;
        border: 1px solid #e2e8f0;
        border-radius: 30px;
        padding: 24px;
      }

      .site-preview {
        position: relative;
        overflow-x: hidden;
        overflow-y: auto;
        width: {{ preview_width }}px;
        height: {{ preview_height }}px;
        border-radius: 42px;
        padding: 0;
        background: var(--site-bg);
        color: var(--site-text);
        font-family: var(--site-font-body), sans-serif;
        box-shadow: 22px 24px 60px rgba(93, 87, 120, 0.22), inset 2px 2px 6px rgba(255, 255, 255, 0.4);
      }

      .site-preview::before {
        position: absolute;
        inset: 0;
        content: "";
        background: var(--site-ambient);
        pointer-events: none;
      }

      .site-preview-canvas {
        position: relative;
        min-height: 100%;
      }

      .site-stage-badge {
        position: absolute;
        left: 24px;
        top: 20px;
        z-index: 20;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        max-width: calc(100% - 48px);
        padding: 9px 16px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.4);
        color: var(--site-text);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        backdrop-filter: blur(14px);
      }

      .site-block {
        position: relative;
        overflow: hidden;
        width: 100%;
        height: 100%;
        border: var(--site-border-width) var(--site-border-style) var(--site-border);
        border-radius: var(--site-radius);
        background: var(--site-surface);
        color: var(--site-text);
        box-shadow: var(--site-shadow);
      }

      .site-preview[data-site-style="glass"] .site-block {
        backdrop-filter: blur(20px);
      }

      .site-preview[data-site-style="hard"] .site-block {
        box-shadow: none;
      }

      .site-preview[data-site-style="neon"] .site-block {
        box-shadow: var(--site-shadow), 0 0 28px rgba(255, 255, 255, 0.12);
      }

      .published-node {
        position: absolute;
      }

      .site-text-block {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .site-text-block h1,
      .site-text-block h2,
      .site-text-block h3 {
        margin: 0;
        font-family: var(--site-font-heading), serif;
        font-weight: 700;
        line-height: 0.96;
      }

      .site-text-block h1 {
        font-size: clamp(2rem, 3.4vw, 3.7rem);
      }

      .site-text-block h2 {
        font-size: clamp(1.6rem, 2.2vw, 2.6rem);
      }

      .site-text-block h3 {
        font-size: clamp(1.3rem, 1.9vw, 1.8rem);
      }

      .site-text-block p {
        margin: 0;
        color: var(--site-muted);
        font-size: 0.98rem;
        line-height: 1.7;
      }

      .published-text-stack {
        display: grid;
        gap: 16px;
      }

      .site-eyebrow {
        margin: 0 0 0.9rem;
        color: var(--site-accent);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.32em;
        text-transform: uppercase;
      }

      .published-image-media {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .published-image-caption {
        position: absolute;
        inset-inline: 16px;
        bottom: 16px;
        padding: 10px 14px;
        border-radius: 999px;
        background: rgba(12, 18, 34, 0.55);
        color: #ffffff;
        font-size: 0.95rem;
        backdrop-filter: blur(10px);
      }

      .published-container-block {
        padding: 24px;
      }

      .published-container-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        padding-bottom: 16px;
      }

      .published-container-header h3,
      .published-form-block h3 {
        margin: 0;
        font-family: var(--site-font-heading), serif;
        font-size: 1.5rem;
        line-height: 1.05;
      }

      .published-container-badge {
        display: inline-flex;
        align-items: center;
        min-height: 34px;
        padding: 0 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.25);
        color: var(--site-muted);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }

      .published-container-body {
        position: relative;
        height: calc(100% - 4.25rem);
        border-radius: calc(var(--site-radius) - 8px);
        border: 1px dashed rgba(255, 255, 255, 0.3);
        background: rgba(255, 255, 255, 0.1);
      }

      .published-empty-state {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        color: var(--site-muted);
        text-align: center;
      }

      .published-form-block {
        padding: 24px;
      }

      .published-form-preview {
        display: grid;
        gap: 14px;
        height: 100%;
      }

      .site-form-shell label,
      .published-form-field label {
        display: block;
        margin-bottom: 0.45rem;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .published-form-grid {
        display: grid;
        gap: 12px;
      }

      .published-form-field input,
      .published-form-field textarea {
        width: 100%;
        border: var(--site-border-width) var(--site-border-style) var(--site-border);
        border-radius: calc(var(--site-radius) * 0.7);
        background: var(--site-surface-alt);
        color: var(--site-text);
        padding: 0.85rem 1rem;
      }

      .published-form-field textarea {
        min-height: 112px;
        resize: vertical;
      }

      .published-form-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .published-submit {
        border: none;
        border-radius: calc(var(--site-radius) * 0.74);
        padding: 0.95rem 1.3rem;
        color: #ffffff;
        font-weight: 700;
        background: linear-gradient(135deg, var(--site-accent), rgba(255, 255, 255, 0.16));
        box-shadow: 0 16px 32px rgba(0, 0, 0, 0.12);
        cursor: pointer;
      }

      .published-preview-note,
      .published-copy {
        color: var(--site-muted);
      }

      .published-success-banner {
        padding: 12px 14px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.18);
        color: var(--site-text);
        font-weight: 700;
      }

      .published-automation-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .published-automation-badge {
        display: inline-flex;
        align-items: center;
        min-height: 32px;
        padding: 0 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.18);
        color: var(--site-muted);
        font-size: 0.78rem;
        font-weight: 700;
      }

      @media (max-width: 900px) {
        .published-shell {
          padding-inline: 10px;
        }

        .published-topbar,
        .canvas-grid {
          width: min(calc(100vw - 20px), calc({{ preview_width }}px + 10px));
        }
      }
    </style>
  </head>
  <body>
    <div class="published-shell">
      <header class="published-topbar">
        <div class="published-topbar-copy">
          <p class="published-kicker">Temporary Deploy</p>
          <p class="published-topbar-title">{{ project_name }}</p>
          <p class="published-topbar-subtitle">
            Page: {{ current_page.name }} · Theme: {{ theme.label }}
          </p>
        </div>

        <div class="published-topbar-actions">
          {% if has_multiple_pages %}
            <nav class="published-page-strip" aria-label="Website pages">
              {% for page in page_links %}
                <a
                  href="{{ page.url }}"
                  class="published-page-chip{% if page.is_current %} is-current{% endif %}"
                >
                  {{ page.name }}
                </a>
              {% endfor %}
            </nav>
          {% endif %}

          <a href="/builder/" class="published-link-pill">Builder</a>
          <a href="/backend-view/" class="published-link-pill">Backend</a>
          <a href="/" class="published-link-pill published-link-pill--dark">Dashboard</a>
        </div>
      </header>

      <div class="published-stage-scroll" aria-label="Website preview">
        <div class="canvas-grid">
          <div
            data-site-style="{{ surface_treatment }}"
            class="site-preview"
          >
            <div
              class="site-preview-canvas"
              style="width: {{ preview_width }}px; min-height: {{ content_height + 56 }}px; padding: 28px;"
            >
              <div class="site-stage-badge">{{ current_page.description }}</div>
              {{ page_markup }}
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      document.addEventListener("submit", function (event) {
        var form = event.target;
        if (!(form instanceof HTMLFormElement) || !form.hasAttribute("data-preview-form")) {
          return;
        }

        event.preventDefault();
        form.reset();
        var banner = form.querySelector("[data-preview-success]");
        if (banner instanceof HTMLElement) {
          banner.hidden = false;
        }
      });
    </script>
  </body>
</html>
